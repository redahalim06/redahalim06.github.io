<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TD1 - Exo2</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map { height: 90vh; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="infos"></div>

  <script>
    const map = L.map("map").setView([43.6969, 7.2706], 13);

    const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    const toner = L.tileLayer("https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}{r}.png?api_key=eed6a6b4-d171-43e4-8215-e5f8490b4245", {
      maxZoom: 20,
      attribution: "&copy; Stadia Maps &copy; Stamen Design &copy; OpenStreetMap"
    });

    L.control.layers({
      "OpenStreetMap": osm,
      "Stamen Toner": toner
    }).addTo(map);


    const NICE = [43.6969, 7.2706]; // Place Masséna
    L.marker(NICE).addTo(map).bindPopup("Nice centre");

    navigator.geolocation.getCurrentPosition(function (position) {
      const moi = [position.coords.latitude, position.coords.longitude];
      const precision = position.coords.accuracy; // en mètres

      map.setView(moi, 13);
      L.marker(moi).addTo(map).bindPopup("Ma position (± " + precision + " m)").openPopup();

      L.circle(moi, { radius: precision, color: "green" }).addTo(map);


      document.getElementById("infos").textContent =
        "Distance jusqu'à Marseille : " + distanceKm(moi, MARSEILLE).toFixed(1) + " km";
           
      tracerTrajet(moi, MARSEILLE);
    });

    L.polygon([
      [25.7617, -80.1918], // Miami
      [32.3078, -64.7505], // Bermudes
      [18.4655, -66.1057]  // San Juan
    ], { color: "red" }).addTo(map).bindPopup("Triangle des Bermudes");

    const MARSEILLE = [43.2965, 5.3698]; // Vieux-Port

    L.marker(MARSEILLE).addTo(map).bindPopup("Marseille");
    L.polyline([MARSEILLE, NICE], { color: "blue" }).addTo(map);

    function distanceKm(p1, p2) {
      const R = 6371;
      const rad = Math.PI / 180;
      const dLat = (p2[0] - p1[0]) * rad;
      const dLon = (p2[1] - p1[1]) * rad;
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(p1[0] * rad) * Math.cos(p2[0] * rad) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }


    fetch("https://geo.api.gouv.fr/departements/06/communes?fields=nom,population&format=geojson&geometry=contour")
      .then(function (reponse) { return reponse.json(); })
      .then(function (data) {
        L.geoJSON(data, {
          style: { color: "purple", weight: 1, fillOpacity: 0.1 },
          onEachFeature: function (feature, layer) {
            layer.bindPopup(feature.properties.nom + "<br>Population : " + feature.properties.population);
          }
        }).addTo(map);
      });
    

    function tracerTrajet(depart, arrivee) {
      const url = "https://router.project-osrm.org/route/v1/driving/" +
                  depart[1] + "," + depart[0] + ";" + arrivee[1] + "," + arrivee[0] +
                  "?overview=full&geometries=geojson";

      fetch(url)
        .then(function (reponse) { return reponse.json(); })
        .then(function (data) {
          const route = data.routes[0];
          L.geoJSON(route.geometry, { style: { color: "orange", weight: 4 } })
            .addTo(map)
            .bindPopup("En voiture : " + (route.distance / 1000).toFixed(1) + " km, " +
                       Math.round(route.duration / 60) + " min");
        });
    }

  </script>
</body>
</html>
