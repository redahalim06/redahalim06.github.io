<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TD1 - Exo2</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map { height: 90vh; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    const map = L.map("map").setView([43.6969, 7.2706], 13);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    const NICE = [43.6969, 7.2706]; // Place Masséna
    L.marker(NICE).addTo(map).bindPopup("Nice centre");

    navigator.geolocation.getCurrentPosition(function (position) {
    const moi = [position.coords.latitude, position.coords.longitude];

    map.setView(moi, 13);
    L.marker(moi).addTo(map).bindPopup("Ma position").openPopup();
    });

    L.polygon([
      [25.7617, -80.1918], // Miami
      [32.3078, -64.7505], // Bermudes
      [18.4655, -66.1057]  // San Juan
    ], { color: "red" }).addTo(map).bindPopup("Triangle des Bermudes");
  </script>
</body>
</html>
